  '@parcel/watcher': true
  esbuild: true
  oxc-resolver: true
  rolldown: true
  sharp: true
  unrs-resolver: true
  vue-demi: true

catalogs:
  content:
    '@bikariya/shiki': ^0.0.8
    '@nuxt/content': ^3.16.1
    '@nuxtjs/seo': ^5.3.16
    '@shikijs/colorized-brackets': ^4.4.3
    '@shikijs/transformers': ^4.4.3
    '@types/hast': ^3.0.5
    '@types/mdast': ^4.0.4
    abcjs: ^6.7.1
    mermaid: ^12.0.0
    minimark: 0.2.0
    nuxt-llms: ^0.2.0
    plain-shiki: ^0.3.2
    rehype-katex: ^7.0.1
    remark-math: ^6.0.0
    remark-reading-time: ^2.1.0
    shiki: ^4.4.3
    unist-util-visit: ^5.1.0
    vfile: ^6.0.3
    zod: ^4.6.5
  framework:
    '@zinkawaii/tsconfig': ^0.1.0
    ci-info: ^4.4.0
    lightningcss: ^1.33.0
    nuxt: ^4.5.2
    pinia: ^4.0.3
    typescript: 6.0.3
    unrun: ^0.3.1
    unplugin-yaml: ^4.3.0
    vue: ^3.5.43
    vue-router: ^5.3.1
  quality:
    '@antfu/eslint-config': ^9.5.1
    '@nuxt/hints': ^1.1.4
    '@zinkawaii/eslint-config-css': ^0.5.4
    cspell: ^10.3.6
    eslint: ^10.11.0
  ui:
    '@bikariya/image-viewer': ^0.0.8
    '@bikariya/modals': ^0.0.8
    '@iconify-json/catppuccin': ^1.2.17
    '@iconify-json/line-md': ^1.2.16
    '@iconify-json/ri': ^1.2.10
    '@iconify-json/simple-icons': ^1.2.98
    '@iconify-json/tabler': ^1.2.41
    '@nuxt/icon': ^2.5.1
    '@nuxt/image': ^2.1.0
    '@nuxtjs/color-mode': ^4.0.1
    embla-carousel-autoplay: ^8.6.0
    embla-carousel-vue: ^8.6.0
    embla-carousel-wheel-gestures: ^8.1.0
    vue-tippy: ^6.8.0
  util:
    '@clack/prompts': ^1.8.1
    '@pinia/nuxt': ^1.0.2
    '@vueuse/core': ^15.0.0
    '@vueuse/nuxt': ^15.0.0
    '@vueuse/router': ^15.0.0
    es-toolkit: ^1.52.0
    fast-xml-builder: ^1.3.1
    minisearch: ^7.2.0
    oxc-minify: ^0.152.0
    p-limit: ^7.3.3
    parse-domain: ^8.4.0
    rimraf: ^6.1.3
    site-config-stack: ^4.2.3
    strip-ansi: ^7.2.0
    temporal-polyfill: ^1.0.5

engineStrict: true

patchedDependencies:
  # 图片支持配置 1.5x 像素密度
  '@nuxt/image': patches/@nuxt__image.patch
  # 代码块不将 tab 转为空格
  # 行内代码 props.code 传入原文
  '@nuxtjs/mdc': patches/@nuxtjs__mdc.patch
  # IPX 的 Sharp 无法处理 ICO ，但改变运行时 NuxtImg provider 有类型问题 https://github.com/nuxt/image/issues/2174
  ipx: patches/ipx.patch
  # adoptedStyleSheet ::highlight 高亮选择器
  plain-shiki: patches/plain-shiki.patch

shamefullyHoist: true
